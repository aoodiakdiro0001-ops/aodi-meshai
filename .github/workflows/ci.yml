name: Aodı-MeshAI CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: router + sandbox + storage tests (بلا شبكة)
        run: python3 tests/test_meshai.py -v

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.21" }
      - name: vet + build gateway
        run: |
          cd gateway
          gofmt -w .
          go vet ./...
          go build ./...

  node-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --check telemetry/relay.js
